<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RhymeMapper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314141c'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='%23ff9f43' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>RhymeMapper</h1>
      <span class="tagline">phonetic rhyme analysis</span>
    </div>
    <div class="controls">
      <label>
        <span>Track</span>
        <select id="trackSelect"></select>
      </label>
      <label>
        <span>Engine</span>
        <select id="engineSelect" title="Only applies to lyrics you analyse yourself">
          <option value="similarity">similarity</option>
          <option value="chains">chains</option>
          <option value="families">families</option>
          <option value="exact">exact (v1)</option>
        </select>
      </label>
      <button id="pasteToggle" type="button">Analyse your own</button>
      <button id="dimToggle" type="button" aria-pressed="true">Dim non-rhyming</button>
    </div>
  </header>

  <section id="pastePanel" hidden>
    <textarea id="lyricsInput" rows="6" spellcheck="false"
      placeholder="Paste lyrics here, one line per line, then press Analyse."></textarea>
    <div class="paste-actions">
      <button id="analyseBtn" type="button">Analyse</button>
      <span id="pasteStatus"></span>
    </div>
  </section>

  <div id="player" class="player" hidden>
    <audio id="audio" controls preload="metadata"></audio>
    <span class="player-note">Rhymes light up in time with the track.</span>
  </div>

  <div id="stats" class="stats" hidden></div>

  <main>
    <div id="lyrics" class="lyrics">
      <p class="placeholder">Pick a track to begin.</p>
    </div>

    <aside id="sidebar">
      <h2>Rhyme groups</h2>
      <p class="hint">Click to isolate. Hover the lyrics to trace a group.</p>
      <ol id="groupList" class="group-list"></ol>
    </aside>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <footer>
    <p>RhymeMapper &middot; phonetic rhyme-scheme analysis</p>
  </footer>

  <script src="data.js" onerror="window.rhymeDataMissing = true"></script>
  <script src="app.js"></script>
</body>
</html>
