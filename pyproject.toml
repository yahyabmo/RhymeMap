[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhymemapper"
version = "2.0.0"
description = "Phonetic rhyme-scheme analysis for rap lyrics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "g2p_en",
    "syllabify",
    "nltk",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scipy",
]

[project.scripts]
rhymemap = "rhymemap.main:main"

[tool.setuptools]
packages = ["rhymemap", "analysis", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # long lines are handled by line-length, not enforced in docstrings
    "B008",   # function calls in argument defaults are not used here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["rhymemap", "analysis", "scripts"]
