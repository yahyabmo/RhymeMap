# Build the read-only demo and publish it to GitHub Pages.
#
# The site is static: songs are analysed here, at build time, and baked into
# data.js. Nothing runs on the server afterwards, which is why this can be
# hosted free and permanently. Analysing a new link needs the local server;
# the page says so rather than offering a box that cannot work.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you publish from any branch by hand

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          extras: ruff

      # Gate the deploy on the code being sound. Previously this workflow and
      # CI ran side by side on the same push, so a commit that failed its tests
      # still published - the live site could be built from code known to be
      # broken, and nothing stopped it.
      - name: Lint
        run: ruff check .

      - name: Test
        run: ./run_tests.sh

      - name: Build the static site
        run: python -m scripts.build_static --output site

      - name: Check the build produced a usable page
        run: |
          test -s site/index.html || { echo "index.html missing or empty"; exit 1; }
          test -s site/data.js    || { echo "data.js missing or empty"; exit 1; }
          test -f site/.nojekyll  || { echo ".nojekyll missing: Pages would skip _-prefixed files"; exit 1; }
          python - <<'PY'
          import pathlib, re
          from scripts.build_static import OPTIONAL_ASSETS

          page = pathlib.Path("site/index.html").read_text(encoding="utf-8")
          checked, skipped = 0, []
          for asset in re.findall(r'(?:src|href)="([^"]+)"', page):
              if asset.startswith(("http://", "https://", "//", "#", "data:", "mailto:")):
                  continue
              name = asset.split("?")[0].lstrip("/")
              # The author photo is supplied by whoever runs the project, so the
              # page references it whether or not it exists; the card falls back
              # to a lettered disc. Referencing it must not fail the build.
              if name in OPTIONAL_ASSETS:
                  skipped.append(name)
                  continue
              assert (pathlib.Path("site") / name).exists(), \
                  f"{asset} is referenced by index.html but was not built"
              checked += 1
          assert checked, "no local assets found: the check is not looking at the right page"
          print(f"every required asset is present ({checked} checked)")
          if skipped:
              print(f"optional, absent: {', '.join(skipped)}")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
