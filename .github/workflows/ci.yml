name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build workaround for `distance`
        # g2p_en depends on `distance`, whose setup.py uses the `install_layout`
        # attribute removed in setuptools 60. Build it against an older
        # setuptools before the main install resolves it.
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<60"
          python -m pip install --no-build-isolation distance
          python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}

      - name: Fetch NLTK corpora
        run: python -m scripts.fetch_nltk_data

      - name: Lint
        run: ruff check .

      - name: Test
        run: ./run_tests.sh

      - name: Smoke-test the pipeline
        run: |
          python -m scripts.generate_stats --quiet
          python -m analysis.run_all_plots
          python -m src.main --no-dataset
