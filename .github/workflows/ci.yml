name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # g2p_en is installed with --no-deps: it declares `distance`, whose
        # setup.py uses an attribute setuptools removed in v60, and it never
        # imports it. Downgrading setuptools to work around that broke pip
        # itself on 3.12 ("Cannot import 'setuptools.build_meta'"), which is
        # what this replaces.
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt ruff
          python -m pip install --no-deps g2p_en

      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}

      - name: Fetch NLTK corpora
        run: python -m scripts.fetch_nltk_data

      - name: Lint
        run: ruff check .

      - name: Test
        run: ./run_tests.sh

      - name: Smoke-test the pipeline
        run: |
          python -m scripts.generate_stats --quiet
          python -m analysis.run_all_plots
          python -m rhymemap.main --no-dataset
          python -m eval.build_gold
          python -m eval.ablation
